[project]
name = "spanloc"
version = "0.2.0"
description = "Stdlib-only issue localization (BM25 + AST call graph + personalized PageRank) for small offline coding agents"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# analysis only; spanloc stays stdlib
analysis = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "huggingface_hub>=0.25",
    "tqdm>=4.66",
    "kaggle>=1.6",
]

[project.scripts]
spanloc = "spanloc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spanloc", "locbench", "agentloc"]

[tool.ruff]
line-length = 120
